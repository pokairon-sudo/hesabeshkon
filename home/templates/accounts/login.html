{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به حساب‌شکن</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/glassmorphism.css' %}">

  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: var(--bg-dark);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      background: #FFFFFF;
      border: 2px solid #000000;
      border-radius: var(--radius-lg);
      box-shadow: 6px 6px 0px #000000;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo-icon {
      width: 80px;
      height: 80px;
      background: var(--primary);
      border: 2px solid #000000;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 1rem;
      box-shadow: 4px 4px 0px #000000;
    }

    .login-title {
      font-size: 1.75rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .login-subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .login-divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 2px;
      background: #000000;
    }

    .login-divider span {
      padding: 0 1rem;
    }

    .social-login {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem;
      background: #FFFFFF;
      border: 2px solid #000000;
      border-radius: var(--radius-md);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.15s;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 2px 2px 0px #000000;
    }

    .social-btn:hover {
      background: var(--accent);
      transform: translate(-2px, -2px);
      box-shadow: none;
    }

    .login-footer {
      text-align: center;
      margin-top: 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .login-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .input-icon {
      position: relative;
    }

    .input-icon svg {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 1.25rem;
      height: 1.25rem;
    }

    .input-icon input {
      padding-right: 3rem;
    }
  </style>
</head>
<body>
  <div class="background-animate"></div>

  <div class="login-container">
    <div class="glass login-card slide-up">
      <div class="login-logo">
        <div class="login-logo-icon">🏪</div>
        <h1 class="login-title">حساب‌شکن</h1>
        <p class="login-subtitle">سیستم مدیریت فروش و انبار</p>
      </div>

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        {% if form.errors %}
        <div class="glass-card mb-3" style="border-color: rgba(255, 106, 0, 0.4);">
          <p style="color: #ff6a00; font-size: 0.9rem;">نام کاربری یا رمز عبور اشتباه است.</p>
        </div>
        {% endif %}

        <div class="form-group">
          <label class="form-label">ایمیل</label>
          <div class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
            </svg>
            <input type="email" name="username" class="glass-input" placeholder="email@example.com" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">رمز عبور</label>
          <div class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input type="password" name="password" class="glass-input" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="glass-btn glass-btn-primary w-full" style="margin-top: 1rem;">
          <span>ورود به سیستم</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
          </svg>
        </button>
      </form>

      <div class="login-divider">
        <span>یا ورود سریع</span>
      </div>

      <div class="social-login">
        <button class="social-btn" onclick="alert('ثبت‌نام عمومی غیرفعال است. با مدیر تماس بگیرید.')">
          <span>👤</span>
          <span>اپراتور</span>
        </button>
        <button class="social-btn" onclick="alert('ثبت‌نام عمومی غیرفعال است. با مدیر تماس بگیرید.')">
          <span>👑</span>
          <span>مدیر</span>
        </button>
      </div>

      <div class="login-footer">
        <p>نسخه ۲.۰ | طراحی با ❤️</p>
      </div>
    </div>
  </div>

  <script>
    // Auto-focus email input
    document.querySelector('input[type="email"]')?.focus();
  </script>
</body>
</html>
