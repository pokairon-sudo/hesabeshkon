{% extends 'index.html' %}

{% block title %}
Register
{% endblock title %}

{% block content %}
<div class="flex items-center justify-center h-screen bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96 border border-gray-300">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Create an Account</h2>
        <form method="post" class="mt-6">
            {% csrf_token %}
            <div class="mb-4">
                {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="block text-gray-700">{{ field.label }}</label>
                    <input type="{{ field.field.widget.type }}" 
                           name="{{ field.name }}" 
                           id="{{ field.id_for_label }}" 
                           value="{{ field.value|default_if_none:'' }}"
                           class="mt-1 p-2 border-2 border-black rounded-lg focus:outline-none focus:border-blue-500" 
                           placeholder="{{ field.field.widget.attrs.placeholder|default:'' }}" 
                           {% if field.field.required %}required{% endif %}>
                    <!-- Render error messages if any -->
                    {% if field.errors %}
                    <div class="text-red-500 mt-1">
                        {{ field.errors.as_text }}
                    </div>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white font-semibold hover:bg-blue-600 py-2 px-4 border-2 border-black rounded-lg transition duration-200 hover:border-transparent">
                Register
            </button>
        </form>
        <div class="mt-4 text-center">
            <p class="text-gray-600">Already have an account? <a href="#" class="text-blue-500 hover:underline">Login here</a>.</p>
        </div>
    </div>
</div>
{% endblock content %}
